<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Y! 360°</title>
<style>
html,body{margin:0;height:100%;background:#fff;font:12px Tahoma,sans-serif}
iframe{display:block;width:100%;height:100%;border:0}
p{display:none;margin:16px}
body[data-bad] iframe{display:none}body[data-bad] p{display:block}
/* Waiting screen (y360.js): covers the frame until the blog itself has loaded. */
.wait{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#fff,#f6f1fb);color:#6d5a8e}
body[data-waiting] .wait{display:flex}
body[data-waiting] iframe{visibility:hidden}
.wait .logo{font:italic 34px Georgia,'Times New Roman',serif;color:#2c6f8f;letter-spacing:.5px}
.wait .logo b{font:bold 30px Georgia,'Times New Roman',serif;color:#7b0099;font-style:normal;margin-right:4px}
.wait .bar{width:160px;height:6px;border:1px solid #c9bde0;border-radius:4px;background:#fff;overflow:hidden}
.wait .bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#b892e0,#7b4bb8);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.wait .bar i{animation:none;width:100%}}
</style>
</head>
<body>
<iframe title="Y! 360°" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe>
<p>Địa chỉ này không phải trang Y! 360°.</p>
<div class="wait" role="status"><div class="logo"><b>Y!</b>360°</div><div class="bar"><i></i></div><div>Đang mở Y! 360°…</div></div>
<script src="y360.js"></script>
</body>
</html>
